name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test under a sub-path (cPanel style)
        run: TEST_BASE_PATH=/school npm test
